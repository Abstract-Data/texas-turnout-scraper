name: Karl Rove report

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: America/Chicago
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HTML/PDF artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VEP_API_KEY: ${{ secrets.VEP_API_KEY }}
      VEP_BASE_URL: ${{ secrets.VEP_BASE_URL }}
      EV_API_BASE_URL: ${{ secrets.EV_API_BASE_URL }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      EV_API_TOKEN: ${{ secrets.EV_API_TOKEN }}
      EV_API_AGGREGATES_TOKEN: ${{ secrets.EV_API_AGGREGATES_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev --extra reports

      - name: Install Chromium for PDF
        run: uv run playwright install chromium

      - name: Build report (live APIs)
        if: env.VEP_API_KEY != '' && env.EV_API_TOKEN != ''
        run: uv run python -m reports.karl_rove build --output-dir dist/karl-rove

      - name: Build report (fixture fallback)
        if: env.VEP_API_KEY == '' || env.EV_API_TOKEN == ''
        run: uv run python -m reports.karl_rove build --fixture --output-dir dist/karl-rove

      - name: Upload Confidential artifact
        uses: actions/upload-artifact@b7c566a772cceee6dfbfff6dfa9c43e88a128c43 # v6
        with:
          name: karl-rove-report
          path: dist/karl-rove/
          retention-days: 7
          if-no-files-found: error
