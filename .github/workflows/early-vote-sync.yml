name: Early vote sync

# Civix EVR statewide roster (or turnout JSON) → per-election D1 + KV version bump.
# data-refresh.yml is unchanged (GitHub Pages CSV).
#
# KV propagation ~60s — not election-night real-time.
#
# workflow_dispatch: dry_run defaults true. Dry-run job has no secrets.
# Apply uses GitHub Environment `preview` (required reviewers — John must approve).
# Scheduled runs use sync_mode=backfill, election_id=53815, statewide_roster. The portal's
# per-date files are daily and can gain late records, so every run re-hashes every day: an
# unchanged day writes nothing, a changed day is rewritten and the KV version bumps.
# dry_run=false → apply job still waits on preview approval (not unattended).
#
# D1/KV writes use Cloudflare REST API + op run (not the Worker read path).

on:
  schedule:
    # ~2×/day UTC while EV window is open (03:00 and 15:00 UTC).
    - cron: "0 3,15 * * *"
  workflow_dispatch:
    inputs:
      sync_mode:
        description: "single date, latest published EV date, or backfill all EV dates"
        required: true
        default: "single"
        type: choice
        options:
          - single
          - latest
          - backfill
      election_id:
        description: "source_election_id (Nov 2026 general = 53815)"
        required: true
        default: "53815"
        type: string
      election_date:
        description: "MM/DD/YYYY (required for sync_mode=single)"
        required: false
        type: string
      dry_run:
        description: "true hashes and prints the plan. false writes D1 then bumps KV."
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      payload_kind:
        description: "turnout JSON or statewide roster CSV (EVR_STATEWIDE, redacted before D1)"
        required: true
        default: "statewide_roster"
        type: choice
        options:
          - "statewide_roster"
          - "turnout"

permissions:
  contents: read

concurrency:
  group: early-vote-sync-${{ github.event_name == 'schedule' && '53815' || inputs.election_id }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: Dry run
    if: >-
      (github.event_name == 'schedule' && false) ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Validate workflow inputs
        env:
          SYNC_MODE: ${{ github.event_name == 'schedule' && 'backfill' || inputs.sync_mode }}
          ELECTION_ID: ${{ github.event_name == 'schedule' && '53815' || inputs.election_id }}
          ELECTION_DATE: ${{ github.event_name == 'schedule' && '' || inputs.election_date }}
        run: |
          set -euo pipefail
          if [[ ! "${ELECTION_ID}" =~ ^[0-9]+$ ]]; then
            echo "::error::election_id must be digits only"
            exit 1
          fi
          if [[ "${SYNC_MODE}" == "single" ]]; then
            if [[ -z "${ELECTION_DATE}" ]]; then
              echo "::error::election_date is required when sync_mode=single"
              exit 1
            fi
            if [[ ! "${ELECTION_DATE}" =~ ^(0[1-9]|1[0-2])/(0[1-9]|[12][0-9]|3[01])/[0-9]{4}$ ]]; then
              echo "::error::election_date must be MM/DD/YYYY"
              exit 1
            fi
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install package
        run: uv sync --locked --extra waf

      - name: Hash early-vote payload(s)
        env:
          SYNC_MODE: ${{ github.event_name == 'schedule' && 'backfill' || inputs.sync_mode }}
          ELECTION_ID: ${{ github.event_name == 'schedule' && '53815' || inputs.election_id }}
          ELECTION_DATE: ${{ github.event_name == 'schedule' && '' || inputs.election_date }}
          PAYLOAD_KIND: ${{ github.event_name == 'schedule' && 'statewide_roster' || inputs.payload_kind }}
        run: |
          set -euo pipefail
          args=(
            --election-id "${ELECTION_ID}"
            --sync-mode "${SYNC_MODE}"
            --payload-kind "${PAYLOAD_KIND}"
            --http-backend cloudscraper
            --dry-run
          )
          if [[ -n "${ELECTION_DATE}" ]]; then
            args+=(--date "${ELECTION_DATE}")
          fi
          uv run python -m texas_turnout_scraper.early_vote_sync "${args[@]}"

  apply:
    name: Apply preview
    if: >-
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false')
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 180
    steps:
      - name: Validate workflow inputs
        env:
          SYNC_MODE: ${{ github.event_name == 'schedule' && 'backfill' || inputs.sync_mode }}
          ELECTION_ID: ${{ github.event_name == 'schedule' && '53815' || inputs.election_id }}
          ELECTION_DATE: ${{ github.event_name == 'schedule' && '' || inputs.election_date }}
        run: |
          set -euo pipefail
          if [[ ! "${ELECTION_ID}" =~ ^[0-9]+$ ]]; then
            echo "::error::election_id must be digits only"
            exit 1
          fi
          if [[ "${SYNC_MODE}" == "single" ]]; then
            if [[ -z "${ELECTION_DATE}" ]]; then
              echo "::error::election_date is required when sync_mode=single"
              exit 1
            fi
            if [[ ! "${ELECTION_DATE}" =~ ^(0[1-9]|1[0-2])/(0[1-9]|[12][0-9]|3[01])/[0-9]{4}$ ]]; then
              echo "::error::election_date must be MM/DD/YYYY"
              exit 1
            fi
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install package
        run: uv sync --locked --extra waf

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0
        with:
          version: "2.41.0"

      - name: Require the 1Password service account token
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OP_SERVICE_ACCOUNT_TOKEN:-}" ]; then
            echo "::error::OP_SERVICE_ACCOUNT_TOKEN is empty. Set it on the preview environment before apply."
            exit 1
          fi

      - name: Write D1 (defer KV until after precompute backfill)
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EV_SNAPSHOT_BUCKET: tx-turnout-ev-snapshots-preview
          SYNC_MODE: ${{ github.event_name == 'schedule' && 'backfill' || inputs.sync_mode }}
          ELECTION_ID: ${{ github.event_name == 'schedule' && '53815' || inputs.election_id }}
          ELECTION_DATE: ${{ github.event_name == 'schedule' && '' || inputs.election_date }}
          PAYLOAD_KIND: ${{ github.event_name == 'schedule' && 'statewide_roster' || inputs.payload_kind }}
        run: |
          set -euo pipefail
          args=(
            --election-id "${ELECTION_ID}"
            --sync-mode "${SYNC_MODE}"
            --payload-kind "${PAYLOAD_KIND}"
            --http-backend cloudscraper
            --apply
            --defer-kv-bump
          )
          if [[ -n "${ELECTION_DATE}" ]]; then
            args+=(--date "${ELECTION_DATE}")
          fi
          sync_report="$(mktemp)"
          op run --environment s6tljdcafkgqxfuxhcnj3m5x5a -- \
            uv run python -m texas_turnout_scraper.early_vote_sync "${args[@]}" | tee "${sync_report}"
          SYNC_SHA="$(awk -F= '/^sha256=/{print $2; exit}' "${sync_report}")"
          if [[ -z "${SYNC_SHA}" ]]; then
            echo "::error::sync report missing sha256= line"
            exit 1
          fi
          SYNC_STATUS="$(awk -F= '/^status=/{print $2; exit}' "${sync_report}")"
          echo "SYNC_SHA=${SYNC_SHA}" >> "${GITHUB_ENV}"
          echo "SYNC_STATUS=${SYNC_STATUS}" >> "${GITHUB_ENV}"
      - name: Backfill precomputed D1 aggregates (idempotent)
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ELECTION_ID: ${{ github.event_name == 'schedule' && '53815' || inputs.election_id }}
        run: |
          set -euo pipefail
          precompute_args=(
            --election-id "${ELECTION_ID}"
            --apply
            --finalize-kv-digest "${SYNC_SHA}"
          )
          if [[ "${SYNC_STATUS}" == "wrote" ]]; then
            precompute_args+=(--finalize-kv-after-sync)
          fi
          op run --environment s6tljdcafkgqxfuxhcnj3m5x5a -- \
            uv run python -m texas_turnout_scraper.early_vote_d1_precompute_backfill \
            "${precompute_args[@]}"
