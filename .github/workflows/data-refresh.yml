name: Data Refresh

on:
  schedule:
    - cron: "0 8 * * *" # 8:00 UTC daily (3 AM CT)
  workflow_dispatch:
    inputs:
      election_id:
        description: "Specific election ID to refresh (leave blank for all)"
        required: false
        default: ""
      source:
        description: "Data source to refresh"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - civix
          - legacy

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh election data
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package
        # cli + waf are explicit so this job does not rely on the dev-group
        # mirror. fetch-all / refresh-all do not use DuckDB.
        # uv sync includes the dev group by default and does not sync extras
        # unless --extra is passed (https://docs.astral.sh/uv/concepts/projects/sync/).
        run: uv sync --extra cli --extra waf

      - name: Refresh Civix elections
        id: civix_refresh
        if: >-
          (github.event_name == 'schedule' ||
          github.event.inputs.source == 'all' ||
          github.event.inputs.source == 'civix') &&
          (github.event.inputs.source != 'legacy')
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.election_id }}" ]; then
            uv run tx-turnout civix fetch-all "${{ github.event.inputs.election_id }}" --audit
          else
            uv run tx-turnout civix refresh-all --audit
          fi

      - name: Refresh legacy elections
        id: legacy_refresh
        if: >-
          (github.event_name == 'schedule' ||
          github.event.inputs.source == 'all' ||
          github.event.inputs.source == 'legacy') &&
          (github.event.inputs.source != 'civix')
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.election_id }}" ]; then
            uv run tx-turnout legacy fetch-all "${{ github.event.inputs.election_id }}" --audit
          else
            uv run tx-turnout legacy refresh-all --audit
          fi

      - name: Verify refresh outcome
        run: |
          set -euo pipefail
          civix_outcome="${{ steps.civix_refresh.outcome || 'skipped' }}"
          legacy_outcome="${{ steps.legacy_refresh.outcome || 'skipped' }}"
          election_id="${{ github.event.inputs.election_id }}"
          source="${{ github.event.inputs.source }}"

          civix_failed=false
          legacy_failed=false
          if [ "$civix_outcome" = "failure" ]; then civix_failed=true; fi
          if [ "$legacy_outcome" = "failure" ]; then legacy_failed=true; fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$election_id" ]; then
            if [ "$source" = "all" ]; then
              if $civix_failed && $legacy_failed; then
                echo "Both civix and legacy refresh failed for election_id=$election_id"
                exit 1
              fi
            elif [ "$source" = "civix" ] && $civix_failed; then
              echo "Civix refresh failed for election_id=$election_id"
              exit 1
            elif [ "$source" = "legacy" ] && $legacy_failed; then
              echo "Legacy refresh failed for election_id=$election_id"
              exit 1
            fi
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            if $civix_failed && $legacy_failed; then
              echo "Both civix and legacy scheduled refresh steps failed"
              exit 1
            fi
          fi

      - name: Commit data changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "data: refresh election rosters [skip ci]"
          file_pattern: "data/elections/**"
