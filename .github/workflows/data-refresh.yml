name: Data Refresh

on:
  schedule:
    - cron: "0 8 * * *" # 8:00 UTC daily (3 AM CT)
  workflow_dispatch:
    inputs:
      election_id:
        description: "Specific election ID to refresh (leave blank for all)"
        required: false
        default: ""
      source:
        description: "Data source to refresh"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - civix
          - legacy

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh election data
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: uv sync

      - name: Refresh Civix elections
        if: >-
          (github.event_name == 'schedule' ||
          github.event.inputs.source == 'all' ||
          github.event.inputs.source == 'civix') &&
          (github.event.inputs.source != 'legacy')
        continue-on-error: >-
          ${{
            github.event_name == 'workflow_dispatch' &&
            github.event.inputs.election_id != '' &&
            github.event.inputs.source == 'all'
          }}
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.election_id }}" ]; then
            uv run tx-turnout civix fetch-all "${{ github.event.inputs.election_id }}" --audit
          else
            uv run tx-turnout civix refresh-all --audit
          fi

      - name: Refresh legacy elections
        if: >-
          (github.event_name == 'schedule' ||
          github.event.inputs.source == 'all' ||
          github.event.inputs.source == 'legacy') &&
          (github.event.inputs.source != 'civix')
        continue-on-error: >-
          ${{
            github.event_name == 'workflow_dispatch' &&
            github.event.inputs.election_id != '' &&
            github.event.inputs.source == 'all'
          }}
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.election_id }}" ]; then
            uv run tx-turnout legacy fetch-all "${{ github.event.inputs.election_id }}" --audit
          else
            uv run tx-turnout legacy refresh-all --audit
          fi

      - name: Commit data changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: refresh election rosters [skip ci]"
          file_pattern: "data/elections/**"
