name: Worker tzdata update

# Dependabot can bump uv.lock for infra/preview/worker, but it cannot refresh
# pylock.toml or the committed python_modules/ bundle. This job does the full
# refresh, runs the no-host-tz smoke, and opens a PR for human review.
# It never merges and never deploys.

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tzdata-update
  cancel-in-progress: false

jobs:
  update:
    name: Refresh vendored tzdata
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Compare vendored tzdata with PyPI
        id: check
        run: |
          set -euo pipefail
          python3 infra/preview/worker/scripts/check_tzdata_update.py | tee -a "${GITHUB_OUTPUT}"

      - name: Skip when a PR for this version already exists
        id: existing
        if: steps.check.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          set -euo pipefail
          branch="chore/worker-tzdata-${LATEST}"
          count="$(gh pr list --head "${branch}" --state all --json number --jq length)"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
          echo "exists=$([ "${count}" -gt 0 ] && echo true || echo false)" >> "${GITHUB_OUTPUT}"

      - name: Refresh lock, pylock, and vendored bundle
        if: steps.check.outputs.update == 'true' && steps.existing.outputs.exists == 'false'
        working-directory: infra/preview/worker
        run: |
          set -euo pipefail
          uv lock --upgrade-package tzdata
          uv sync --frozen
          uv run pywrangler sync --force

      - name: No-host-tz-database Pyodide smoke (required gate)
        if: steps.check.outputs.update == 'true' && steps.existing.outputs.exists == 'false'
        working-directory: infra/preview/worker
        run: bash scripts/verify_pyodide_startup.sh

      - name: Open PR with only the tzdata refresh
        if: steps.check.outputs.update == 'true' && steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.check.outputs.latest }}
          CURRENT: ${{ steps.check.outputs.current }}
          BRANCH: ${{ steps.existing.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${BRANCH}"
          git add -A -- \
            infra/preview/worker/uv.lock \
            infra/preview/worker/pylock.toml \
            infra/preview/worker/python_modules/tzdata \
            'infra/preview/worker/python_modules/tzdata-*.dist-info'
          if git diff --cached --quiet; then
            echo "::error::tzdata ${LATEST} is newer but the refresh produced no tracked change"
            exit 1
          fi
          git commit -m "chore(deps): bump Worker vendored tzdata ${CURRENT} to ${LATEST}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${BRANCH}"
          gh pr create --base main --head "${BRANCH}" \
            --title "chore(deps): bump Worker vendored tzdata ${CURRENT} to ${LATEST}" \
            --body "Automated tzdata refresh (#42). The lock upgrade, pywrangler sync, and infra/preview/worker/scripts/verify_pyodide_startup.sh (no host tz database) passed in this job before the PR was opened. Review the diff and merge by hand. Nothing is merged or deployed automatically. Pull requests opened with GITHUB_TOKEN do not start other workflows, so close and reopen this PR to run the Terraform preview checks."
