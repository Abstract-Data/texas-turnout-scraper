name: Terraform preview

on:
  pull_request:
    paths:
      - "infra/preview/**"
      - ".github/workflows/terraform-preview.yml"
  push:
    branches:
      - main
    paths:
      - "infra/preview/**"
      - ".github/workflows/terraform-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fmt-validate:
    name: Format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/preview
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.4"
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Init without the state backend
        run: terraform init -input=false -backend=false

      - name: Validate
        run: terraform validate

      - name: Lint
        run: |
          tflint --init
          tflint

  plan-apply:
    name: Plan and apply preview
    needs: fmt-validate
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: preview
    defaults:
      run:
        working-directory: infra/preview
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.4"
          terraform_wrapper: false

      # version input: https://github.com/1Password/install-cli-action/blob/1a3160d5e9de1ae0803eaa08a88746f5ae3daa50/README.md
      # op run --environment needs CLI >= 2.41.0.
      - name: Install 1Password CLI
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0
        with:
          version: 2.41.0

      - name: Require OP_SERVICE_ACCOUNT_TOKEN
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          if [ -z "${OP_SERVICE_ACCOUNT_TOKEN}" ]; then
            echo "OP_SERVICE_ACCOUNT_TOKEN is empty. Add it as a preview environment secret before plan or apply."
            exit 1
          fi

      - name: Write backend config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_ENDPOINT: ${{ secrets.TF_STATE_ENDPOINT }}
        run: |
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID TF_STATE_BUCKET TF_STATE_ENDPOINT; do
            if [ -z "${!name}" ]; then
              echo "Missing preview environment secret: ${name}"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "Plan and apply stay blocked until those preview environment secrets exist."
            exit 1
          fi
          echo "::add-mask::${CLOUDFLARE_ACCOUNT_ID}"
          echo "::add-mask::${TF_STATE_BUCKET}"
          echo "::add-mask::${TF_STATE_ENDPOINT}"
          umask 077
          cat > backend.hcl <<EOF
          bucket    = "${TF_STATE_BUCKET}"
          endpoints = { s3 = "${TF_STATE_ENDPOINT}" }
          EOF
          printf 'account_id = "%s"\n' "${CLOUDFLARE_ACCOUNT_ID}" > preview.auto.tfvars

      # op run loads the 1Password Environment. Do not pass --no-masking.
      # https://www.1password.dev/environments/read-environment-variables
      - name: Plan and apply preview
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          op run --environment s6tljdcafkgqxfuxhcnj3m5x5a -- bash -c 'missing=0; for name in CLOUDFLARE_API_TOKEN R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do if [ -z "${!name}" ]; then echo "Missing 1Password environment variable: ${name}"; missing=1; fi; done; test "${missing}" -eq 0'
          op run --environment s6tljdcafkgqxfuxhcnj3m5x5a -- bash -c 'AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" terraform init -input=false -backend-config=backend.hcl'
          op run --environment s6tljdcafkgqxfuxhcnj3m5x5a -- bash -c 'AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" terraform plan -input=false -out=tfplan'
          op run --environment s6tljdcafkgqxfuxhcnj3m5x5a -- bash -c 'AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" terraform apply -input=false -auto-approve tfplan'
