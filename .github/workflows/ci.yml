name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Unit tests import the CLI, cloudscraper, DuckDB, and the MCP server.
        # Extras are explicit so those imports do not rely on the dev-group mirror.
        # uv does not sync extras unless --extra is passed
        # (https://docs.astral.sh/uv/concepts/projects/sync/).
        run: uv sync --locked --dev --extra cli --extra waf --extra voterfile --extra mcp

      - name: Ruff lint
        run: uv run ruff check . --select E,W,F,I --quiet

      - name: Ruff format check
        run: uv run ruff format . --check

      - name: Type check
        run: uv run ty check

      - name: Unit tests
        run: uv run pytest tests/unit -q --tb=short

      - name: Verify structural checks
        run: uv run pytest tests/verify -q
