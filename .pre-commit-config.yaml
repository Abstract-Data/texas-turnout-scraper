repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff-check
        name: ruff-check
        args: [--fix, --select, "E,W,F,I,UP"]
      - id: ruff-format
        name: ruff-format

  - repo: local
    hooks:
      - id: ty-check
        name: ty-check
        language: system
        entry: uv run ty check
        pass_filenames: false
        types: [python]

      - id: pytest-unit
        name: pytest-unit
        language: system
        entry: uv run pytest tests/unit -q --tb=short
        pass_filenames: false
        always_run: false
        types: [python]
