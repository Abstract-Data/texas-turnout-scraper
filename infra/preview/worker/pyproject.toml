[project]
name = "tx-turnout-ev-api-preview"
version = "0.1.0"
description = "Preview FastAPI read API Worker for Texas early-vote aggregates"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115",
  "texas-turnout-scraper",
  # Pure-Python scrypt for consumer token digests on Pyodide (no OpenSSL hashlib.scrypt).
  "pyscrypt>=1.6.2",
  # Pyodide has no host zoneinfo DB; zoneinfo falls back to the tzdata package.
  "tzdata",
]

[tool.uv.sources]
texas-turnout-scraper = { path = "../../..", editable = false }

[dependency-groups]
dev = [
  "workers-py==1.17.8",
  "workers-runtime-sdk>=1.9",
]
