[project]
name = "ev-api"
version = "0.1.0"
description = "Preview FastAPI read API for early-vote data on a Cloudflare Python Worker"
requires-python = ">=3.10.5"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ev_api"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

# Cloudflare's FastAPI guide pins requires-python >=3.13 for the Workers
# runtime (https://developers.cloudflare.com/workers/languages/python/packages/fastapi/).
# This package stays importable on the repo's 3.10 gate. It uses no 3.11+ syntax.
# The root texas-turnout-scraper package is unchanged and stays >=3.10.5,<3.13.
