# Preview early-vote read API. Do not deploy this file.
# Do not run wrangler deploy, wrangler kv namespace create, or wrangler d1 create.
# Terraform (a later PR) creates KV, D1, Access, and the route. Nothing here
# is a live resource. account_id is intentionally absent.
#
# ~60s KV propagation is not fit for election-night results. Do not add a
# faster path. https://developers.cloudflare.com/kv/api/write-key-value-pairs/

"$schema" = "node_modules/wrangler/config-schema.json"
name = "preview-ev-api"
main = "src/ev_api/worker.py"
compatibility_date = "2026-10-17"
compatibility_flags = ["python_workers"]
workers_dev = false

# Placeholder ids. They are not Cloudflare resource ids. The Terraform PR
# replaces them. This block does not create a namespace.
[[kv_namespaces]]
binding = "EV_KV"
id = "preview-ev-kv-id-from-terraform"
preview_id = "preview-ev-kv-id-from-terraform"

# One D1 database per election is added by Terraform. No [[d1_databases]]
# block, so this config creates none. EV_D1_BINDINGS maps a string
# source_election_id to the binding attribute on env.

[vars]
EV_D1_BINDINGS = "{}"

# ACCESS_CLIENT_ID and ACCESS_CLIENT_SECRET are Worker secrets, not vars.
# The future TanStack Worker binds this service as EV_API. That binding
# belongs on the caller, not on this Worker:
#   [[services]]
#   binding = "EV_API"
#   service = "preview-ev-api"
