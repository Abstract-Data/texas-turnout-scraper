[project]
name = "texas-turnout-scraper"
version = "0.2.8"
description = "Texas SOS early-voting turnout scraper — httpx, Pydantic v2, Typer CLI, FastMCP server"
readme = "README.md"
authors = [{ name = "John R. Eakin", email = "johnreakin@gmail.com" }]
requires-python = ">=3.10.5,<3.13"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.9.2",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "anyio>=4.4.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
cli = [
    "typer>=0.12.0",
    "rich>=13.9.0",
    "questionary>=2.1.1",
]
mcp = ["mcp[cli]>=1.3.0"]
voterfile = ["duckdb>=1.0.0"]
waf = ["cloudscraper>=1.2.71"]
loader = ["sqlmodel>=0.0.48"]
# Offline geography build only (geo_build). Nothing the loader or Worker imports needs it.
geo = ["shapely>=2.1", "pyproj>=3.6", "pyshp>=2.3"]

[project.scripts]
tx-turnout = "texas_turnout_scraper.cli:app"

[dependency-groups]
dev = [
    "fastapi>=0.115",
    "pytest>=8.2.0",
    "anyio[trio]>=4.4.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ty>=0.0.39",
    # Mirror the extras so a plain `uv sync` still installs the CLI, MCP
    # server, voterfile matcher, and WAF backend for local work.
    # Workflows that run those paths also pass --extra explicitly.
    # Downstream `pip install texas-turnout-scraper` does not get these.
    "typer>=0.12.0",
    "rich>=13.9.0",
    "questionary>=2.1.1",
    "mcp[cli]>=1.3.0",
    "duckdb>=1.0.0",
    "cloudscraper>=1.2.71",
    "sqlmodel>=0.0.48",
    "shapely>=2.1",
    "pyproj>=3.6",
    "pyshp>=2.3",
    "hypothesis>=6.100",
    "pytest-xdist>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/texas_turnout_scraper"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Pywrangler-vendored workers-runtime-sdk (regenerated via `pywrangler sync`).
# Not our code; CI runs `ruff check . --select E,W,F,I`, which surfaces upstream E501.
# Pinned submodule (voterfile-audit-pipeline): provenance and fetch scripts, not our code.
extend-exclude = ["infra/preview/worker/python_modules", "vendor"]

[tool.ruff.lint]
# Selector additions (2026-05-25, post review-suite):
#   BLE   — flake8-blind-except. Catches the bare `except Exception:` pattern
#           that bypassed our NEVER-DO rule in roster.py:319 (P1-SEC-001).
#   DTZ   — flake8-datetimez. Catches `datetime.utcnow()` and other naive
#           datetime calls (audit.py:211 — P2-CODE-001).
#   SLF   — flake8-self. Catches external `_private` attribute access — the
#           pattern that hid in roster.py:103 reaching into LegacySession internals.
#   C901  — mccabe complexity. Flags over-long fetch_all loops (cli.py ~130 LOC).
#   PLR0915/PLR0912/PLR0913 — pylint statement / branch / arg counts.
# Generous thresholds; tighten as refactoring lands.
select = ["E", "W", "F", "I", "UP", "B", "C4", "RUF", "BLE", "DTZ", "SLF", "C901", "PLR0915", "PLR0912", "PLR0913"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-statements = 60
max-branches = 15
max-args = 8

[tool.ruff.lint.per-file-ignores]
# Tests legitimately reach into internals and use long fixtures.
"tests/**/*.py" = ["SLF", "PLR0915", "PLR0912", "PLR0913", "C901"]
# CLI commands are being decomposed; grant temporary amnesty on complexity
# while the dual-source consolidation lands (RosterSource protocol).
"src/texas_turnout_scraper/cli/civix.py" = ["C901", "PLR0915", "PLR0912", "PLR0913"]
"src/texas_turnout_scraper/cli/legacy.py" = ["C901", "PLR0915", "PLR0912", "PLR0913"]
"src/texas_turnout_scraper/cli/voterfile.py" = ["C901", "PLR0915", "PLR0912", "PLR0913"]
# Audit pipeline merge is in flight; check funcs will split after consolidation.
"src/texas_turnout_scraper/audit.py" = ["C901", "PLR0912"]
"src/texas_turnout_scraper/writer.py" = ["C901", "PLR0912", "DTZ007"]
# Calendar-date parsing from SOS/Civix strings — timezone not applicable (DTZ007).
"src/texas_turnout_scraper/elections.py" = ["DTZ007"]
# Civix display timestamps are naive strings; UTC is attached immediately after parse.
"src/texas_turnout_scraper/civix/enr.py" = ["DTZ007"]
"src/texas_turnout_scraper/mcp_server.py" = ["DTZ007"]
"src/texas_turnout_scraper/models.py" = ["DTZ007"]
# Strategy B ZIP download updates session pacing timestamp (SLF001).
"src/texas_turnout_scraper/roster.py" = ["SLF001"]
# DuckDB match stays one function per WS-5C; report/enrichment helpers land later.
"src/texas_turnout_scraper/voterfile.py" = ["C901", "PLR0915", "PLR0912", "DTZ007"]

[tool.ruff.lint.isort]
known-first-party = ["texas_turnout_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["vendor", ".git", "node_modules", ".hypothesis"]
asyncio_mode = "auto"
python_files = ["test_*.py", "check_*.py"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.rules]
# Warn-only until CLI/MCP wiring catches up with module APIs (see ty check output).
all = "warn"

[tool.ty.terminal]
# ty 0.0.87 exits 1 on warning diagnostics by default. ADR-007 keeps the
# project in warn-only mode until the per-file ratchet flips rules to error.
error-on-warning = false

[tool.ty.src]
include = ["src", "tests"]
