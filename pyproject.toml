[project]
name = "texas-turnout-scraper"
version = "0.2.0"
description = "Texas SOS early-voting turnout scraper — httpx, Pydantic v2, Typer CLI, FastMCP server"
readme = "README.md"
authors = [{ name = "John R. Eakin", email = "johnreakin@gmail.com" }]
requires-python = ">=3.10.5,<3.13"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.9.2",
    "typer>=0.12.0",
    "mcp[cli]>=1.3.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "tqdm>=4.66.6",
    "anyio>=4.4.0",
    "duckdb>=1.0.0",
    "cloudscraper>=1.2.71",
]

[project.scripts]
tx-turnout = "texas_turnout_scraper.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "anyio[trio]>=4.4.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ty>=0.0.39",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/texas_turnout_scraper"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["texas_turnout_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py", "check_*.py"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.rules]
# Warn-only until CLI/MCP wiring catches up with module APIs (see ty check output).
all = "warn"

[tool.ty.src]
include = ["src", "tests"]
